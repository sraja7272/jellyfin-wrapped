# Enable output filtering
AddOutputFilterByType SUBSTITUTE text/html

# Enable rewrite engine for SPA routing and backend API proxying
RewriteEngine On
ProxyPreserveHost On

# Forward API, auth, and health requests to the backend container
# Allows exposing a single port behind a reverse proxy (e.g. Caddy)
RewriteRule ^/(api|auth|health)(/.*)?$ http://backend:3001/$1$2 [P,L]

# If the requested resource doesn't exist as a file or directory,
# serve index.html instead (for client-side routing)
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
RewriteRule ^ /index.html [L]

# Define environment variable substitution
<Location />
    # Only perform substitution if environment variables are set
    <If "-n env('BACKEND_URL')">
        Substitute "s|<head>|<head><script>window.ENV = { BACKEND_URL: '${BACKEND_URL}' };</script>|ni"
    </If>
</Location>
